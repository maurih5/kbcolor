name: Artefacto de la PR

# Compila los .rpm y .deb con la version definitiva (X.Y.Z) y los deja como artifact.
# El job "Compilar paquetes" es check obligatorio para mergear a main; al mergear,
# publicar.yml publica ESTOS archivos, sin recompilar.
#
# La version sale de los tags (.github/scripts/version-actual.sh), no del codigo.
# Para que el artefacto sea lo que queda mergeado: la PR tiene que estar al dia con main.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr:
        description: Numero de la PR a compilar
        required: true

# Sin cancelar: opened y labeled llegan sobre el mismo commit; cancelar uno deja el
# check requerido en "cancelled" y la PR BLOCKED.
concurrency:
  group: build-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  actions: read

env:
  VERSION_INICIAL: "0.0.0"
  VERSION_CODE_INICIAL: "0"

jobs:
  compilar:
    name: Compilar paquetes
    runs-on: ubuntu-latest

    steps:
      - name: Datos de la PR
        id: pr
        uses: actions/github-script@v9
        env:
          PR_INPUT: ${{ inputs.pr }}
        with:
          script: |
            const numero = context.payload.pull_request?.number ?? Number(process.env.PR_INPUT);
            if (!Number.isInteger(numero) || numero <= 0) {
              core.setFailed(`Numero de PR invalido: '${process.env.PR_INPUT}'`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: numero });
            if (pr.state !== 'open') {
              core.setFailed(`La PR #${numero} no esta abierta`);
              return;
            }
            const labels = pr.labels.map(l => l.name.toLowerCase());
            let tipo = 'bugfix';
            if (labels.includes('breaking')) tipo = 'breaking';
            else if (labels.includes('feature')) tipo = 'feature';
            core.setOutput('numero', numero);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('tipo', tipo);

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - name: Esperar publicaciones en curso y verificar contra main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Si se acaba de mergear otra PR, su publicacion todavia no creo el tag:
          # compilar ahora calcularia la misma version.
          for i in $(seq 1 30); do
            pendientes=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=50" \
              -q '[.workflow_runs[] | select(.path == ".github/workflows/publicar.yml" and .status != "completed")] | length')
            [ "$pendientes" = "0" ] && break
            echo "⏳ Hay una publicacion en curso, esperando... ($i/30)"
            sleep 30
          done
          [ "$pendientes" = "0" ] || { echo "❌ La publicacion en curso no termino a tiempo; re-ejecuta este check"; exit 1; }

          git fetch --tags --force origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "❌ La PR no esta al dia con main. Actualiza la rama ('Update branch')."
            exit 1
          fi
          echo "BASE_SHA=$(git rev-parse origin/main)" >> "$GITHUB_ENV"

      - name: Calcular version
        shell: bash
        env:
          TIPO: ${{ steps.pr.outputs.tipo }}
        run: |
          set -euo pipefail
          actual=$(bash .github/scripts/version-actual.sh "$VERSION_INICIAL" "$VERSION_CODE_INICIAL")
          echo "$actual"
          nueva=$(bash .github/scripts/calcular-version.sh "$TIPO" \
            "$(sed -n 's/^versionName=//p' <<<"$actual")" "$(sed -n 's/^versionCode=//p' <<<"$actual")")
          version=$(sed -n 's/^version=//p' <<<"$nueva")
          versionCode=$(sed -n 's/^versionCode=//p' <<<"$nueva")
          if git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "❌ El tag $version ya existe: no se puede volver a publicar esa version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "versionCode=$versionCode" >> "$GITHUB_ENV"
          echo "### $version ($versionCode)" >> "$GITHUB_STEP_SUMMARY"

      - name: Compilar .rpm y .deb
        shell: bash
        run: packaging/build.sh "$version"

      - name: Datos de la compilacion
        shell: bash
        env:
          PR: ${{ steps.pr.outputs.numero }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          BASE_REF: ${{ steps.pr.outputs.base_ref }}
          TIPO: ${{ steps.pr.outputs.tipo }}
        run: |
          # publicar.yml compara esto contra la PR mergeada antes de publicar.
          archivos=$(find artefacto -maxdepth 1 -type f -printf '%f\n' | sort | jq -R . | jq -s .)
          [ "$archivos" != "[]" ] || { echo "❌ artefacto/ esta vacio"; exit 1; }
          jq -n \
            --argjson pr "$PR" --arg head_sha "$HEAD_SHA" --arg base_ref "$BASE_REF" \
            --arg base_sha "$BASE_SHA" --arg tipo "$TIPO" \
            --arg version "$version" --arg versionCode "$versionCode" --argjson archivos "$archivos" \
            '{pr: $pr, head_sha: $head_sha, base_ref: $base_ref, base_sha: $base_sha,
              tipo: $tipo, version: $version, versionCode: $versionCode, archivos: $archivos}' > compilacion.json
          mv compilacion.json artefacto/
          cat artefacto/compilacion.json

      - uses: actions/upload-artifact@v7
        with:
          name: artefacto-pr
          path: artefacto/
          retention-days: 30
          if-no-files-found: error
